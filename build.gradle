plugins {
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenLocal()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven { url = "https://maven.shedaniel.me/" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "loader_version", project.fabric_loader_version
    inputs.property "minecraft_version", project.minecraft_version
    filesMatching("fabric.mod.json") {
        expand "version": project.version,
               "loader_version": project.fabric_loader_version,
               "minecraft_version": project.minecraft_version
    }
}

loom {
    mixin {
        defaultRefmapName = "vanilla-outsider-bed-chat-hider-refmap.json"
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

jar {
    from("LICENSE") {
        rename { String name -> name + "_" + project.archives_base_name }
    }
}

afterEvaluate {
    def targetJarTask = tasks.findByName('remapJar') ?: tasks.findByName('jar')
    if (targetJarTask != null) {
        def archiveTask = tasks.register('archiveReleaseJar') {
            group = 'build'
            description = 'Copies built release JAR to external vault when mounted'
            dependsOn targetJarTask
            doLast {
                def jarFile = targetJarTask.archiveFile.get().asFile
                if (jarFile.exists() && file("D:/Minecraft Mod Archive Jars").exists()) {
                    def fnLower = jarFile.name.toLowerCase()
                    if (!fnLower.endsWith("-dev.jar") && !fnLower.endsWith("-sources.jar") && !fnLower.endsWith("-common.jar") && !fnLower.endsWith("-all.jar") && !fnLower.endsWith("-javadoc.jar")) {
                        def vaultDir = file("D:/Minecraft Mod Archive Jars/Bed Chat Hider")
                        vaultDir.mkdirs()
                        copy {
                            from jarFile
                            into vaultDir
                        }
                        println "[DEPLOY-POINT-3] Copied ${jarFile.name} to external vault: ${vaultDir.canonicalPath}"
                    }
                }
            }
        }
        tasks.named('build').configure {
            finalizedBy(archiveTask)
        }
    }
}
